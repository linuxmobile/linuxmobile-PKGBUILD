name: build-repo

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-repo
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  NODE_OPTIONS: --no-deprecation

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          packages="$(find packages -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.package }}
        env:
          PKG: ${{ matrix.package }}
          RUSTFLAGS: -C target-cpu=x86-64-v3
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -e PKG \
            -e RUSTFLAGS \
            archlinux:latest bash -c '
              pacman -Syu --noconfirm --needed base-devel git sudo
              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/builder
              chown -R builder:builder /src/packages /src/scripts /src/config
              cd /src
              sudo -u builder bash scripts/build.sh "$PKG"
            '
      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" packages scripts config
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: packages/${{ matrix.package }}/*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create database
        run: |
          mkdir -p repo
          cp artifacts/*.pkg.tar.zst repo/
          docker run --rm -v "$PWD/repo:/repo" archlinux:latest bash -c '
            cd /repo
            repo-add linuxmobile.db.tar.zst *.pkg.tar.zst
            rm -f linuxmobile.db linuxmobile.files
            mv linuxmobile.db.tar.zst linuxmobile.db
            mv linuxmobile.files.tar.zst linuxmobile.files
          '
          sudo chown -R "$(id -u):$(id -g)" repo
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view repo >/dev/null 2>&1 || gh release create repo --title "linuxmobile repository" --notes "Rolling pacman repository."
          for asset in $(gh release view repo --json assets --jq '.assets[].name'); do
            if [ ! -e "repo/$asset" ]; then
              gh release delete-asset repo "$asset" -y
            fi
          done
          gh release upload repo repo/* --clobber
