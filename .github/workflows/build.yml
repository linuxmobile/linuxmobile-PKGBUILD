name: build-repo

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "scripts/**"
      - "config/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to build (or "all")'
        required: false
        default: "all"

permissions:
  contents: write

concurrency:
  group: build-repo
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  NODE_OPTIONS: --no-deprecation

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.list.outputs.packages }}
      full: ${{ steps.list.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: list
        env:
          EVENT: ${{ github.event_name }}
          TARGET_PKG: ${{ inputs.package }}
        run: |
          full=false
          packages=""

          if [ "$EVENT" = "schedule" ] || [ "$TARGET_PKG" = "all" ]; then
            full=true
            packages="$(find packages -mindepth 2 -maxdepth 2 -type f -name PKGBUILD -printf '%h\n' | sed 's#^packages/##' | sort)"
          elif [ -n "$TARGET_PKG" ]; then
            packages="$(tr ',' '\n' <<< "$TARGET_PKG" | tr -d ' ' | sed '/^$/d')"
          elif git rev-parse --verify "HEAD^" >/dev/null 2>&1; then
            packages="$(git diff --name-only "HEAD^" HEAD | \
              sed -n 's#^packages/\([^/]*\)/.*#\1#p' | \
              sort -u | \
              while read -r p; do
                if [ -f "packages/$p/PKGBUILD" ]; then
                  printf '%s\n' "$p"
                fi
              done)"
          else
            full=true
            packages="$(find packages -mindepth 2 -maxdepth 2 -type f -name PKGBUILD -printf '%h\n' | sed 's#^packages/##' | sort)"
          fi

          json="$(printf '%s\n' "$packages" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "packages=$json" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    strategy:
      fail-fast: false
      # Avoid throttling the release-asset CDN and tiring the GitHub API when a
      # full rebuild fans out dozens of dependency downloads at once.
      max-parallel: 8
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    env:
      PKG: ${{ matrix.package }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      CARGO_INCREMENTAL: "0"
      # Upstream release profiles often use fat LTO with one codegen unit per
      # crate, which turns a cold 900-crate build into an ~80 min serial slog
      # on a 4-core runner. Ship optimized binaries without the memory-hungry
      # whole-program link, and cap parallel rustc processes to fit 7 GB RAM.
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_BUILD_JOBS: "2"
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 1G
      SCCACHE_CLIENT_SIDE: 1
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 512M
    steps:
      - name: Prepare Arch environment
        run: |
          printf "\n[linuxmobile]\nSigLevel = Optional DatabaseOptional\nServer = https://github.com/linuxmobile/linuxmobile-PKGBUILD/releases/download/repo\n" >> /etc/pacman.conf
          # GitHub release assets can be very slow under parallel load. Keep
          # pacman from aborting a download at the default 10-second low-speed
          # threshold; makepkg's dependency installation inherits this config.
          sed -i 's/^#DisableDownloadTimeout/DisableDownloadTimeout/' /etc/pacman.conf
          attempt=1
          while ! pacman -Syu --noconfirm --needed base-devel binutils libarchive git sudo ccache sccache; do
            if [ "$attempt" -ge 3 ]; then
              echo "::warning::package sync failed; retrying without the linuxmobile repo"
              sed -i '/^\[linuxmobile\]$/,/^Server = .*linuxmobile-PKGBUILD/d' /etc/pacman.conf
              pacman -Syu --noconfirm --needed base-devel binutils libarchive git sudo ccache sccache
              break
            fi
            attempt=$((attempt + 1))
            sleep $((attempt * 10))
          done
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/builder

      - uses: actions/checkout@v7

      - name: Prepare cache directories
        run: mkdir -p .cache/cargo .cache/sccache .cache/ccache

      - name: Restore compiler and Cargo caches
        uses: actions/cache@v6
        with:
          path: |
            .cache/cargo/registry
            .cache/cargo/git
            .cache/sccache
            .cache/ccache
          key: archlinux-x86_64-v3-${{ matrix.package }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            archlinux-x86_64-v3-${{ matrix.package }}-

      - name: Build ${{ matrix.package }}
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          sudo --preserve-env=CARGO_NET_GIT_FETCH_WITH_CLI,CARGO_HOME,CARGO_INCREMENTAL,RUSTC_WRAPPER,SCCACHE_DIR,SCCACHE_CACHE_SIZE,CCACHE_DIR,CCACHE_MAXSIZE -u builder bash scripts/build.sh "$PKG"

      - name: Validate x86-64-v3 ELF metadata
        run: bash scripts/validate-package-isa.sh "$PKG"

      - name: Restore workspace ownership
        if: always()
        run: chown -R root:root "$GITHUB_WORKSPACE"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: packages/${{ matrix.package }}/*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [discover, build]
    if: |
      !cancelled() &&
      needs.discover.outputs.packages != '[]' &&
      !contains(needs.build.result, 'cancelled')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Refresh README ISA status
        run: |
          python3 scripts/update-readme-isa.py
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: update package ISA status"
            git push
          fi
      - name: Fetch published packages
        if: needs.discover.outputs.full != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p repo
          # A new repository has no release or archives yet; an existing release
          # with archives must download successfully or the rebuilt database
          # would drop every package that is not part of this build.
          if gh release view repo >/dev/null 2>&1; then
            assets=$(gh release view repo --json assets \
              --jq '[.assets[].name | select(endswith(".pkg.tar.zst"))] | length')
            if [ "$assets" -gt 0 ]; then
              gh release download repo --pattern '*.pkg.tar.zst' --dir repo
            fi
          fi
      - uses: actions/download-artifact@v8
        id: download
        continue-on-error: true
        with:
          path: artifacts
          merge-multiple: true
      - name: Create database
        id: db
        run: |
          shopt -s nullglob
          built=(artifacts/*.pkg.tar.zst)
          shopt -u nullglob
          if [ ${#built[@]} -eq 0 ]; then
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_packages=true" >> "$GITHUB_OUTPUT"

          mkdir -p repo
          cp artifacts/*.pkg.tar.zst repo/
          # Partial rebuilds re-add every previously published package to the
          # db. repo-add keeps a single version per package name and the last
          # one processed (glob order) wins, which could resurrect an older
          # build over the one we just built. Drop old versions of rebuilt
          # packages from the database; the publish step keeps their release
          # archives for a grace period so clients holding the previous db can
          # still download them.
          pkgname_of() {
            local base="${1%.pkg.tar.zst}" namever
            base="${base%-*}"              # drop arch
            namever="${base%-*}"           # drop pkgrel
            printf '%s\n' "${namever%-*}"  # drop pkgver
          }
          for artifact in artifacts/*.pkg.tar.zst; do
            name="$(pkgname_of "$(basename "$artifact")")"
            for published in repo/*.pkg.tar.zst; do
              [ "$published" = "repo/$(basename "$artifact")" ] && continue
              if [ "$(pkgname_of "$(basename "$published")")" = "$name" ]; then
                rm -f "$published"
              fi
            done
          done
          docker run --rm -v "$PWD/repo:/repo" archlinux:latest bash -c '
            cd /repo
            repo-add linuxmobile.db.tar.zst *.pkg.tar.zst
            rm -f linuxmobile.db linuxmobile.files
            mv linuxmobile.db.tar.zst linuxmobile.db
            mv linuxmobile.files.tar.zst linuxmobile.files
          '
          sudo chown -R "$(id -u):$(id -g)" repo
      - name: Publish release
        if: steps.db.outputs.has_packages == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A client can sync the old db just before a publish and only start
          # downloading after we have replaced the assets. Keep the previous
          # archives around briefly so those downloads do not 404.
          ASSET_GRACE_HOURS: '24'
        run: |
          gh release view repo >/dev/null 2>&1 || gh release create repo --title "linuxmobile repository" --notes "Rolling pacman repository."

          cutoff=$(date -u -d "-${ASSET_GRACE_HOURS} hours" +%s)
          while IFS=$'\t' read -r asset updated; do
            [ -n "$asset" ] || continue
            if [ -e "repo/$asset" ]; then
              continue
            fi
            case "$asset" in
              linuxmobile.db|linuxmobile.files) continue ;;
            esac
            published_at=$(date -u -d "$updated" +%s 2>/dev/null) || continue
            if [ "$published_at" -lt "$cutoff" ]; then
              echo "Deleting stale release asset: $asset"
              gh release delete-asset repo "$asset" -y || true
            fi
          done < <(gh release view repo --json assets --jq '.assets[] | [.name, .updatedAt] | @tsv')

          # Upload archives before the databases: a client that sees a new db
          # must never ask for an archive that has not finished uploading.
          mapfile -t archives < <(find repo -maxdepth 1 -name '*.pkg.tar.zst' -print | sort)
          gh release upload repo "${archives[@]}" --clobber
          gh release upload repo repo/linuxmobile.db repo/linuxmobile.files --clobber
      - name: Assert all packages built
        if: contains(needs.build.result, 'failure')
        run: |
          echo "::warning::Some packages failed to build; successfully built packages were published."
          exit 1
