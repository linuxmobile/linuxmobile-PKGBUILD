name: build-repo

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/build.yml'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-repo
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  NODE_OPTIONS: --no-deprecation

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.list.outputs.packages }}
      full: ${{ steps.list.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: list
        env:
          EVENT: ${{ github.event_name }}
        run: |
          full=false
          base="HEAD^"

          if [ "$EVENT" != "push" ]; then
            full=true
          elif ! git rev-parse --verify "$base" >/dev/null 2>&1; then
            full=true
          else
            changed="$(git diff --name-only "$base" HEAD)"
            if printf '%s\n' "$changed" | grep -qE '^(scripts/|config/|\.github/workflows/build\.yml)'; then
              full=true
            fi
          fi

          if [ "$full" = "true" ]; then
            packages="$(find packages -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)"
          else
            packages="$(printf '%s\n' "$changed" |
              sed -n 's#^packages/\([^/]*\)/.*#\1#p' |
              sort -u |
              while read -r p; do
                [ -d "packages/$p" ] && printf '%s\n' "$p"
              done)"
          fi

          json="$(printf '%s\n' "$packages" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "packages=$json" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    env:
      PKG: ${{ matrix.package }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Prepare Arch environment
        run: |
          printf "\n[linuxmobile]\nSigLevel = Optional DatabaseOptional\nServer = https://github.com/linuxmobile/linuxmobile-PKGBUILD/releases/download/repo\n" >> /etc/pacman.conf
          pacman -Syu --noconfirm --needed base-devel git sudo
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/builder

      - uses: actions/checkout@v7

      - name: Build ${{ matrix.package }}
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          sudo --preserve-env=CARGO_NET_GIT_FETCH_WITH_CLI -u builder bash scripts/build.sh "$PKG"

      - name: Restore workspace ownership
        if: always()
        run: chown -R root:root "$GITHUB_WORKSPACE"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: packages/${{ matrix.package }}/*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [discover, build]
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Fetch published packages
        if: needs.discover.outputs.full != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p repo
          gh release download repo --pattern '*.pkg.tar.zst' --dir repo || true
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create database
        run: |
          mkdir -p repo
          cp artifacts/*.pkg.tar.zst repo/
          docker run --rm -v "$PWD/repo:/repo" archlinux:latest bash -c '
            cd /repo
            repo-add linuxmobile.db.tar.zst *.pkg.tar.zst
            rm -f linuxmobile.db linuxmobile.files
            mv linuxmobile.db.tar.zst linuxmobile.db
            mv linuxmobile.files.tar.zst linuxmobile.files
          '
          sudo chown -R "$(id -u):$(id -g)" repo
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL: ${{ needs.discover.outputs.full }}
        run: |
          gh release view repo >/dev/null 2>&1 || gh release create repo --title "linuxmobile repository" --notes "Rolling pacman repository."
          if [ "$FULL" = "true" ]; then
            for asset in $(gh release view repo --json assets --jq '.assets[].name'); do
              if [ ! -e "repo/$asset" ]; then
                gh release delete-asset repo "$asset" -y
              fi
            done
          fi
          gh release upload repo repo/* --clobber
